name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v1.2.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.5.1
      - name: Install development dependencies
        run: npm ci
      - name: Verify immutable release source
        shell: pwsh
        run: |
          if ($env:INPUT_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Tag must be an exact release tag." }
          $tagVersion = $env:INPUT_TAG.Substring(1)
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) { throw "Tag/package version mismatch." }
          $head = git rev-parse HEAD
          git show-ref --verify --quiet "refs/tags/$env:INPUT_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Requested release tag does not exist." }
          $tagHead = git rev-parse "$env:INPUT_TAG^{commit}"
          if ($head -ne $tagHead) { throw "Checkout does not match the requested tag." }
          npm run quality
        env:
          INPUT_TAG: ${{ inputs.tag }}
      - name: Publish with npm trusted publishing provenance
        run: npm publish --access public --provenance
