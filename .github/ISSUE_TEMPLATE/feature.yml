name: Feature request
description: Propose a narrowly scoped improvement.
title: "enhancement: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and compatibility boundaries
      description: Explain what must remain fail-closed and which existing callers could be affected.
    validations:
      required: true
  - type: textarea
    id: reverse_case
    attributes:
      label: Required reverse case
      description: Describe the incorrect state that the implementation must reject.
    validations:
      required: true
